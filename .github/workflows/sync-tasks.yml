# 自動タスク実行記録の写し（client/src/data/taskLog.ts）を Notion「DB_monet 自動タスク実行記録」に合わせる。
# 書き込み元は Mac mini の自動タスク（HPBブログ 6:00・20:00／サロンボード取得 7:30）。
# 毎日 8:30 と 21:30（日本時間）に取り込み、管理画面の「自動タスク」タブへ反映する。
# 写しには取り込み時刻が入るので、毎回コミットされる（画面は「この時刻の時点」で判定するため）。
# 2026-11-26 林さん「この案で作って」。鍵は repo シークレット NOTION_TOKEN（hayashin-guard）。
name: Sync task log

on:
  schedule:
    - cron: "30 23,12 * * *" # 8:30／21:30（日本時間）
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-tasks
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Notion から写しを作り直す
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/sync-task-log.mjs
      # vite7 と @builder.io/vite-plugin-jsx-loc の peer 衝突があるため legacy-peer-deps 必須
      - run: npm ci --legacy-peer-deps
      - name: 型チェック (tsc --noEmit)
        run: npx tsc --noEmit
      - name: テスト (vitest)
        run: npx vitest run
      - name: コミットして本番へ反映
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/data/taskLog.ts
          git commit -m "自動タスク実行記録の写しをNotionに合わせて更新（$(TZ=Asia/Tokyo date '+%F %H:%M')）"
          git pull --rebase origin main
          git push origin HEAD:main
          # 自動コミットの push では Deploy Pages が起動しないため、ここで起動する
          gh workflow run pages.yml --ref main
