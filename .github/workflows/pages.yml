# GitHub Pages への静的デプロイ（Railwayトライアル失効に伴う無料移行 2026-07-11）
# main への push ごとに client を静的ビルドして公開する。
# データは全て gviz 匿名CSV読み（クライアント側fetch）のため静的ホスティングで動作する。
# DB由来の店舗マスタ・退社情報はコード内フォールバックで供給（tRPC失敗時に自動的に効く）。
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      # 同じコードを2回ビルドして別URLで配信する（2026-08-31 スタッフ向け／管理者向けの仕分け）。
      # スタッフ向けバンドルには広告・設定のコードがそもそも含まれない（VITE_ROLE で分岐＋tree-shake）。
      - name: スタッフ向けビルド（既存URL /monet-dashboard/）
        run: VITE_BASE=/monet-dashboard/ VITE_ROLE=staff npx vite build
      - name: スタッフ向けに広告コードが混ざっていないか検査
        run: |
          if grep -rq -e '1z5JU' -e 'adset_meta' -e 'ROAS' dist/public/assets; then
            echo "::error::スタッフ向けバンドルに広告コードが含まれています"
            exit 1
          fi
      - name: 管理者向けビルド（新URL /monet-dashboard/admin-view/）
        run: VITE_BASE=/monet-dashboard/admin-view/ VITE_ROLE=admin npx vite build --outDir "$PWD/dist/admin-view"
      - name: 管理者向けを配信先へ配置
        run: mv dist/admin-view dist/public/admin-view
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
