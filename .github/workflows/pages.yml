# GitHub Pages への静的デプロイ（Railwayトライアル失効に伴う無料移行 2026-07-11）
# main への push ごとに client を静的ビルドして公開する。
# データは全て gviz 匿名CSV読み（クライアント側fetch）のため静的ホスティングで動作する。
# DB由来の店舗マスタ・退社情報はコード内フォールバックで供給（tRPC失敗時に自動的に効く）。
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: 静的ビルド（/monet-dashboard/ 配下で配信）
        run: VITE_BASE=/monet-dashboard/ npx vite build
      - name: SPAルーティング用の404.html
        run: cp dist/public/index.html dist/public/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
